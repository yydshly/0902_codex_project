<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MediaCMS 视频管理平台架构</title>
  <desc id="desc">展示业务系统、管理人员和终端用户如何通过 React、Nginx、Django、PostgreSQL、Redis、Celery、FFmpeg、Bento4、Whisper 与共享媒体存储完成视频上传、管理、转码、字幕和播放。</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1e3a5f" flood-opacity="0.13"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 38px; font-weight: 700; fill: #10243e; }
      .subtitle { font-size: 17px; fill: #5f7188; }
      .lane-title { font-size: 16px; font-weight: 700; letter-spacing: 1px; fill: #64748b; }
      .box-title { font-size: 21px; font-weight: 700; fill: #172b4d; }
      .box-sub { font-size: 15px; fill: #607089; }
      .white-title { font-size: 24px; font-weight: 700; fill: white; }
      .white-sub { font-size: 16px; fill: #dbeafe; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .flow-label { font-size: 14px; font-weight: 700; fill: #52657c; }
      .badge { font-size: 15px; font-weight: 700; fill: white; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1490" cy="80" r="170" fill="#dbeafe" opacity="0.45"/>
  <circle cx="90" cy="850" r="210" fill="#ede9fe" opacity="0.45"/>

  <text x="800" y="57" text-anchor="middle" class="title">MediaCMS 视频管理平台架构</text>
  <text x="800" y="87" text-anchor="middle" class="subtitle">从上传与管理，到异步转码、存储、鉴权和在线播放</text>

  <!-- External actors -->
  <text x="60" y="132" class="lane-title">外部角色与系统</text>
  <g filter="url(#shadow)">
    <rect x="95" y="153" width="250" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="137" cy="199" r="23" fill="#e2e8f0"/>
    <path d="M127 206h20M131 196h12M137 187v19" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <text x="180" y="192" class="box-title">业务系统 / LMS</text>
    <text x="180" y="217" class="box-sub">API 与课程平台集成</text>

    <rect x="480" y="153" width="230" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="525" cy="188" r="14" fill="#94a3b8"/>
    <path d="M500 224c4-20 12-27 25-27s21 7 25 27" fill="#cbd5e1"/>
    <text x="565" y="192" class="box-title">管理人员</text>
    <text x="565" y="217" class="box-sub">上传、编辑、审核</text>

    <rect x="1255" y="153" width="230" height="92" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <circle cx="1300" cy="188" r="14" fill="#94a3b8"/>
    <path d="M1275 224c4-20 12-27 25-27s21 7 25 27" fill="#cbd5e1"/>
    <text x="1340" y="192" class="box-title">终端用户</text>
    <text x="1340" y="217" class="box-sub">检索与在线播放</text>
  </g>

  <!-- MediaCMS boundary -->
  <rect x="55" y="280" width="1490" height="565" rx="28" fill="#ffffff" fill-opacity="0.7" stroke="#a8b8cf" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="80" y="262" width="148" height="36" rx="18" fill="#10243e"/>
  <text x="154" y="286" text-anchor="middle" style="font-size:17px;font-weight:700;fill:white">MediaCMS</text>

  <!-- Access layer -->
  <text x="82" y="335" class="lane-title">接入与展示层</text>
  <g filter="url(#shadow)">
    <rect x="330" y="355" width="365" height="106" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <rect x="353" y="381" width="56" height="44" rx="7" fill="#2563eb"/>
    <path d="M363 416l12-17 9 11 7-9 8 15z" fill="#bfdbfe"/>
    <text x="430" y="397" class="box-title">React 前端 + video.js</text>
    <text x="430" y="426" class="box-sub">上传、管理、搜索、播放界面</text>

    <rect x="885" y="355" width="300" height="106" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
    <path d="M922 385h49v45h-49z M932 395h29M932 405h29M932 415h20" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="994" y="397" class="box-title">Nginx 网关</text>
    <text x="994" y="426" class="box-sub">反向代理、鉴权、媒体分发</text>
  </g>

  <!-- Core layer -->
  <text x="82" y="510" class="lane-title">业务控制层</text>
  <g filter="url(#shadow)">
    <rect x="330" y="530" width="520" height="112" rx="22" fill="url(#core)"/>
    <path d="M372 559h43v52h-43z M382 570h23M382 580h23M382 590h15" fill="none" stroke="#ffffff" stroke-width="3"/>
    <text x="444" y="574" class="white-title">Django + REST API</text>
    <text x="444" y="605" class="white-sub">权限与内容管理 · 工作流 · API 集成</text>

    <rect x="965" y="530" width="330" height="112" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <ellipse cx="1010" cy="558" rx="25" ry="10" fill="#10b981"/>
    <path d="M985 558v39c0 6 11 10 25 10s25-4 25-10v-39" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="1010" cy="578" rx="25" ry="10" fill="none" stroke="#10b981" stroke-width="2"/>
    <text x="1060" y="574" class="box-title">PostgreSQL</text>
    <text x="1060" y="603" class="box-sub">元数据、用户、权限、搜索</text>
  </g>

  <!-- Processing layer -->
  <text x="82" y="688" class="lane-title">异步媒体处理层</text>
  <g filter="url(#shadow)">
    <rect x="135" y="708" width="300" height="100" rx="19" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="177" cy="758" r="24" fill="#7c3aed"/>
    <path d="M166 758h22M177 747v22" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <text x="217" y="748" class="box-title">Redis + Celery</text>
    <text x="217" y="777" class="box-sub">异步任务队列</text>

    <rect x="500" y="708" width="230" height="100" rx="19" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="544" cy="758" r="23" fill="#7c3aed"/>
    <path d="M533 747l23 11-23 11z" fill="white"/>
    <text x="582" y="748" class="box-title">FFmpeg</text>
    <text x="582" y="777" class="box-sub">多清晰度转码</text>

    <rect x="765" y="708" width="230" height="100" rx="19" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="809" cy="758" r="23" fill="#7c3aed"/>
    <path d="M796 750h26M796 758h26M796 766h26" stroke="white" stroke-width="3"/>
    <text x="847" y="748" class="box-title">Bento4</text>
    <text x="847" y="777" class="box-sub">HLS 自适应流</text>

    <rect x="1030" y="708" width="230" height="100" rx="19" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="1074" cy="758" r="23" fill="#7c3aed"/>
    <path d="M1063 750h22v16h-22z M1068 755h12" fill="none" stroke="white" stroke-width="3"/>
    <text x="1112" y="748" class="box-title">Whisper</text>
    <text x="1112" y="777" class="box-sub">自动字幕</text>

    <rect x="1300" y="688" width="205" height="120" rx="20" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
    <path d="M1332 728h141v46h-141z" fill="#a7f3d0" stroke="#059669" stroke-width="2"/>
    <path d="M1346 718h113l14 10h-141z" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <text x="1402" y="714" text-anchor="middle" class="box-title">共享媒体存储</text>
    <text x="1402" y="792" text-anchor="middle" style="font-size:13px;fill:#527064">原始视频 · 转码文件</text>
    <text x="1402" y="811" text-anchor="middle" style="font-size:13px;fill:#527064">HLS · 字幕</text>
  </g>

  <!-- Flows -->
  <path d="M220 245 V565 H330" class="flow" stroke="#2563eb" stroke-dasharray="8 7" marker-end="url(#arrowBlue)"/>
  <rect x="195" y="364" width="82" height="28" rx="14" fill="#dbeafe"/>
  <text x="236" y="383" text-anchor="middle" class="flow-label">API 集成</text>

  <path d="M595 245 V355" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="610" y="284" width="88" height="28" rx="14" fill="#dbeafe"/>
  <text x="654" y="303" text-anchor="middle" class="flow-label">上传 / 管理</text>

  <path d="M1370 245 C1310 300 1240 325 1185 382" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="1283" y="299" width="88" height="28" rx="14" fill="#dbeafe"/>
  <text x="1327" y="318" text-anchor="middle" class="flow-label">在线播放</text>

  <path d="M695 408 H885" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <text x="790" y="396" text-anchor="middle" class="flow-label">页面 / API</text>

  <path d="M1035 461 C1035 500 930 505 850 565" class="flow" stroke="#2563eb" marker-end="url(#arrowBlue)"/>
  <rect x="902" y="488" width="62" height="28" rx="14" fill="#dbeafe"/>
  <text x="933" y="507" text-anchor="middle" class="flow-label">鉴权</text>

  <path d="M850 586 H965" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text x="907" y="574" text-anchor="middle" class="flow-label">读写</text>

  <path d="M500 642 C460 676 395 685 330 708" class="flow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <rect x="388" y="658" width="84" height="28" rx="14" fill="#ede9fe"/>
  <text x="430" y="677" text-anchor="middle" class="flow-label">派发任务</text>

  <path d="M435 758 H500" class="flow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M435 758 C565 664 690 664 765 730" class="flow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>
  <path d="M435 758 C680 630 920 648 1030 731" class="flow" stroke="#7c3aed" marker-end="url(#arrowPurple)"/>

  <path d="M615 808 V828 H1280" class="flow" stroke="#059669"/>
  <path d="M880 808 V828" class="flow" stroke="#059669"/>
  <path d="M1145 808 V828" class="flow" stroke="#059669"/>
  <path d="M1280 828 Q1300 828 1300 808" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <text x="1215" y="820" text-anchor="end" class="flow-label">媒体产物</text>

  <path d="M1402 688 V408 H1185" class="flow" stroke="#059669" marker-end="url(#arrowGreen)"/>
  <rect x="1347" y="482" width="110" height="46" rx="16" fill="#d1fae5"/>
  <text x="1402" y="501" text-anchor="middle" class="flow-label">受鉴权的</text>
  <text x="1402" y="519" text-anchor="middle" class="flow-label">媒体分发</text>

  <!-- Number badges -->
  <g>
    <circle cx="577" cy="333" r="15" fill="#2563eb"/><text x="577" y="339" text-anchor="middle" class="badge">1</text>
    <circle cx="866" cy="408" r="15" fill="#2563eb"/><text x="866" y="414" text-anchor="middle" class="badge">2</text>
    <circle cx="486" cy="666" r="15" fill="#7c3aed"/><text x="486" y="672" text-anchor="middle" class="badge">3</text>
    <circle cx="1280" cy="758" r="15" fill="#059669"/><text x="1280" y="764" text-anchor="middle" class="badge">4</text>
    <circle cx="1402" cy="451" r="15" fill="#059669"/><text x="1402" y="457" text-anchor="middle" class="badge">5</text>
  </g>

  <text x="800" y="876" text-anchor="middle" style="font-size:14px;fill:#718096">控制面：Django 管理内容与权限　·　处理面：Celery 调度转码与字幕　·　数据面：Nginx 分发媒体文件</text>
</svg>
